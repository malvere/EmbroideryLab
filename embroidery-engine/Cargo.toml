[package]
name = "embroidery-lab"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Independent editable vector-to-machine-embroidery laboratory"
default-run = "embroidery-lab"

[lib]
name = "embroidery_lab"

[[bin]]
name = "embroidery-lab"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "embroidery-cli"
path = "src/bin/embroidery-cli.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]
capture = ["gui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
usvg = { version = "0.49", default-features = false }
roxmltree = "0.21"
cavalier_contours = "0.9"
geo = "0.31"
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"] }
eframe = { version = "0.33", optional = true, default-features = false, features = ["glow", "default_fonts", "accesskit"] }
rfd = { version = "0.15", optional = true }

[profile.release]
opt-level = 2
strip = true
lto = false
codegen-units = 16
